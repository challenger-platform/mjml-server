services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: repo.enga.systems/mjml-server:latest
    container_name: mjml-server
    env_file:
      - .env
    volumes:
      - .:/app # Mount your code
      - /app/node_modules
    networks:
      - backend  # Join the existing network

networks:
  backend:
    name: backend_network
    external: true
